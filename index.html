<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SodaFish 小食堂 · 复古车票风</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9F%3C/text%3E%3C/svg%3E">
<script>
  try { if (localStorage.getItem("sodaTheme") === "dark") document.documentElement.className = "soda-dark"; } catch (e) {}
</script>
<style>
  :root { --bg:#f4f6f9; --fg:#4f5a66; --sub:#8e99a6; --card:#ffffff; --line:rgba(168,177,190,0.16); }
  html.soda-dark { --bg:#2a2a2a; --fg:#e0dcd5; --sub:#a09b93; --card:#3a3a3a; --line:rgba(255,255,255,0.03); }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); }
  #sodaFrame { display:block; width:100%; height:100vh; height:100dvh; border:0; background:var(--bg); }
  #sodaWrapLoad {
    position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
    background-color:var(--bg);
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:25px 25px; transition:opacity .3s ease, visibility .3s;
  }
  #sodaWrapLoad.gone { opacity:0; visibility:hidden; pointer-events:none; }
  /* ===== 加载屏「floating 小世界」（与内层 app 启动屏同款，两层无缝衔接） ===== */
  /* 居中容器：场景 + 文字作为一个整体水平垂直居中，三端一致；不参与动画，避免 transform 被覆盖 */
  .sw-stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; }
  .sw-stageUnit { position:relative; width:340px; height:430px; }
  .sw-scene { position:absolute; left:50%; top:50%; transform:translate3d(-50%,-50%,0); width:340px; height:430px; }
  .sw-scene .sw-fish, .sw-scene .sw-bub, .sw-scene .sw-star, .sw-scene .sw-weed, .sw-scene .sw-orbit, .sw-scene .sw-tubfish { position:absolute; pointer-events:none; overflow:visible; }
  /* 性能：只给真正运动的元素开合成层；绝不对 .sw-scene / .sw-stage 设 transform，否则会覆盖居中定位 */
  .sw-scene .sw-body, .sw-scene .sw-bub, .sw-scene .sw-star, .sw-scene .sw-weed,
  .sw-scene .sw-orbit, .sw-scene .sw-tubfish { will-change:transform; backface-visibility:hidden; }
  .sw-scene .sw-body { animation:swWiggle 1.4s ease-in-out infinite; transform-origin:60% 50%; }
  @keyframes swWiggle { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(4deg) translateY(1px); } }
  @keyframes swBob { 0%,100% { transform:translate3d(0,0,0); } 50% { transform:translate3d(0,-9px,0); } }
  @keyframes swRise { 0% { transform:translate3d(0,0,0); opacity:0; } 12% { opacity:.95; } 70% { opacity:.8; } 100% { transform:translate3d(14px,-260px,0); opacity:0; } }
  .sw-scene .sw-star { animation:swTwinkle 2.8s ease-in-out infinite; }
  @keyframes swTwinkle { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  .sw-scene .sw-sign {
    position:absolute; left:50px; top:10px; width:190px; height:250px;
    background:#fff; border:2px solid #bdbdbd; border-radius:10px; transform:rotate(-2deg);
    display:flex; flex-direction:column; align-items:center; padding-top:40px; z-index:2;
    animation:swSignSway 6.5s ease-in-out infinite; transform-origin:50% 0; box-shadow:0 4px 14px rgba(0,0,0,.05);
  }
  @keyframes swSignSway { 0%,100% { transform:rotate(-1.6deg); } 50% { transform:rotate(-.9deg); } }
  .sw-scene .sw-tape { position:absolute; top:-14px; left:30px; background:#8a8a8a; color:#f5f5f5; font-family:"Courier New",monospace; font-size:.68rem; padding:.25rem .7rem; border-radius:4px; transform:rotate(-3deg); }
  .sw-scene .sw-words { font-family:"Segoe Script","Comic Sans MS",cursive; font-size:.95rem; color:#8a8a8a; line-height:1.7; text-align:left; padding:0 14px; }
  .sw-scene .sw-doodles { margin-top:auto; padding-bottom:16px; opacity:.75; }
  .sw-scene .sw-weed { transform-origin:50% 100%; animation:swWeed 4.2s ease-in-out infinite; }
  .sw-scene .sw-weed.s2 { animation-delay:-2.1s; }
  @keyframes swWeed { 0%,100% { transform:rotate(-3deg); } 50% { transform:rotate(3deg); } }
  .sw-scene .sw-tub { position:absolute; bottom:12px; left:50%; transform:translate3d(-50%,0,0); width:250px; }
  .sw-scene .sw-tubfish { left:50%; top:38px; margin-left:-16px; animation:swBob 2.4s ease-in-out infinite; }
  .sw-scene .sw-orbit1 { animation:swOrbitA 9s linear infinite; }
  .sw-scene .sw-orbit2 { animation:swOrbitB 9s linear infinite; animation-delay:-4.5s; }
  /* 巡游鱼：单向游动 + 边缘淡出后透明回起点，全程不翻转、不压缩，杜绝压扁闪回；空档仅 6% 几乎全程可见 */
  @keyframes swOrbitA { 0% { transform:translate3d(28px,96px,0); opacity:0; } 6% { opacity:1; } 44% { transform:translate3d(244px,46px,0); opacity:1; } 50% { transform:translate3d(252px,42px,0); opacity:0; } 51% { transform:translate3d(28px,96px,0); opacity:0; } 56% { opacity:1; } 94% { transform:translate3d(244px,46px,0); opacity:1; } 100% { transform:translate3d(252px,42px,0); opacity:0; } }
  @keyframes swOrbitB { 0% { transform:translate3d(248px,150px,0); opacity:0; } 6% { opacity:1; } 44% { transform:translate3d(32px,202px,0); opacity:1; } 50% { transform:translate3d(24px,206px,0); opacity:0; } 51% { transform:translate3d(248px,150px,0); opacity:0; } 56% { opacity:1; } 94% { transform:translate3d(32px,202px,0); opacity:1; } 100% { transform:translate3d(24px,206px,0); opacity:0; } }
  .sw-center { position:relative; text-align:center; z-index:5; }
  .sw-card { display:inline-block; padding:.46rem 1.25rem .5rem; border:1.5px dashed #85796b; border-radius:11px; background:rgba(255,253,249,.82); box-shadow:2px 3px 0 rgba(0,0,0,.045); }
  .sw-card .t { font-family:"KaiTi","STKaiti","Kaiti SC",serif; font-size:1.05rem; letter-spacing:1px; color:#3d342c; display:block; line-height:1.5; }
  .sw-card .s { font-family:"Courier New",monospace; font-size:.64rem; letter-spacing:2px; color:#7d9dbb; display:block; margin-top:.2rem; }
  .sw-card .r { margin-top:.9rem; font-size:.9rem; padding:.35rem 1.1rem; cursor:pointer; border:1px dashed #85796b; border-radius:20px; background:transparent; color:#3d342c; font-family:inherit; }
  @media (max-width:400px) {
    .sw-stageUnit { transform:scale(.82); }
    .sw-card { padding:.4rem 1rem; } .sw-card .t { font-size:1rem; } .sw-card .s { font-size:.6rem; letter-spacing:1.5px; }
    /* 中低端机性能适配：只减装饰动画数量，主体视觉不变 */
    .sw-orbit2, .sw-bub[style*="-2.2s"], .sw-bub[style*="-4s"], .sw-star[style*="-1.3s"] { display:none; }
    .sw-scene .sw-sign { animation-duration:7s; box-shadow:none; }
  }
  @media (max-height:660px) { .sw-stageUnit { transform:scale(.8); } }
  @media (max-width:400px) and (max-height:660px) { .sw-stageUnit { transform:scale(.7); } }
</style>
</head>
<body>
<div id="sodaWrapLoad">
 <div class="sw-stage">
  <div class="sw-stageUnit">
   <div class="sw-scene" aria-hidden="true">
    <!-- 巡游金鱼 -->
    <svg class="sw-orbit sw-orbit1" style="width:74px;" viewBox="0 0 120 70"><g class="sw-body"><path d="M38 35 C36 16 20 8 8 14 C12 22 12 27 8 35 C12 43 12 48 8 56 C20 62 36 54 38 35 Z" fill="#f6c76f"/><path d="M36 35 C36 14 58 6 78 10 C94 14 100 25 100 35 C100 45 94 56 78 60 C58 64 36 56 36 35 Z" fill="#f6c76f"/><circle cx="84" cy="26" r="4" fill="#3a3a3a"/></g></svg>
    <svg class="sw-orbit sw-orbit2" style="width:58px; opacity:.92;" viewBox="0 0 120 70"><g class="sw-body" style="animation-delay:-.5s"><path d="M82 35 C84 16 100 8 112 14 C108 22 108 27 112 35 C108 43 108 48 112 56 C100 62 84 54 82 35 Z" fill="#f6c76f"/><path d="M84 35 C84 14 62 6 42 10 C26 14 20 25 20 35 C20 45 26 56 42 60 C62 64 84 56 84 35 Z" fill="#f6c76f"/><circle cx="36" cy="26" r="3.4" fill="#3a3a3a"/></g></svg>
    <!-- 小牌子 -->
    <div class="sw-sign">
      <span class="sw-tape">( ´ ` )ノ</span>
      <div class="sw-words">Floating<br>in&nbsp;my<br>own<br>little<br>world.</div>
      <svg class="sw-doodles" width="120" height="38" viewBox="0 0 120 38" fill="none">
        <ellipse cx="16" cy="20" rx="11" ry="6" stroke="#a9a9a9" stroke-width="2"/>
        <path d="M27 20 L34 15 L34 25 Z" stroke="#a9a9a9" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="11" cy="18" r="1.6" fill="#a9a9a9"/>
        <path d="M56 14 a5 5 0 1 0 -5 5 a9 9 0 1 0 -9 -9 a14 14 0 1 0 14 14" stroke="#a9a9a9" stroke-width="2" stroke-linecap="round"/>
        <path d="M96 22 c-3 -6 -12 -3 -8 3 c2 3 6 5 8 8 c2 -3 6 -5 8 -8 c4 -6 -5 -9 -8 -3 Z" stroke="#a9a9a9" stroke-width="2"/>
      </svg>
    </div>
    <!-- 海草 -->
    <svg class="sw-weed" style="left:6px; bottom:30px; width:56px;" viewBox="0 0 60 90" fill="none"><path d="M14 88 C10 60 16 38 12 14 C20 30 22 58 22 88 Z" fill="#b5cda0"/><path d="M34 88 C30 56 40 30 36 8 C44 26 46 58 44 88 Z" fill="#9fb98b"/></svg>
    <svg class="sw-weed s2" style="right:4px; bottom:26px; width:50px;" viewBox="0 0 60 90" fill="none"><path d="M20 88 C16 58 24 34 20 10 C28 28 30 58 30 88 Z" fill="#9fb98b"/><path d="M40 88 C38 62 44 42 42 20 C50 38 50 64 48 88 Z" fill="#b5cda0"/></svg>
    <!-- 浴盆与小鱼 -->
    <div class="sw-tub">
      <svg style="width:100%; display:block;" viewBox="0 0 250 150" fill="none">
        <path d="M26 62 C26 108 66 134 125 134 C184 134 224 108 224 62" stroke="#9ec3e6" stroke-width="3" stroke-linecap="round" fill="#fdfefd"/>
        <path d="M26 62 C30 44 44 36 60 40 C66 22 88 16 104 26 C116 10 144 12 154 30 C170 22 192 30 198 46 C212 44 222 50 224 62" stroke="#9ec3e6" stroke-width="3" stroke-linecap="round" fill="#fdfefd"/>
        <ellipse cx="125" cy="72" rx="82" ry="20" fill="#dcebf5"/>
        <ellipse cx="66" cy="70" rx="8" ry="5" fill="#fff" opacity=".9"/>
        <ellipse cx="182" cy="76" rx="7" ry="4.5" fill="#fff" opacity=".9"/>
      </svg>
      <svg class="sw-tubfish" style="width:62px;" viewBox="0 0 120 70"><g class="sw-body" style="animation-delay:-.2s"><path d="M82 35 C84 16 100 8 112 14 C108 22 108 27 112 35 C108 43 108 48 112 56 C100 62 84 54 82 35 Z" fill="#f6c76f"/><path d="M84 35 C84 14 62 6 42 10 C26 14 20 25 20 35 C20 45 26 56 42 60 C62 64 84 56 84 35 Z" fill="#f6c76f"/><circle cx="36" cy="26" r="3.6" fill="#3a3a3a"/></g></svg>
    </div>
    <!-- 泡泡 & 星星 -->
    <svg class="sw-bub" style="left:150px; bottom:120px; width:18px; animation:swRise 5.5s linear infinite;" viewBox="0 0 30 40"><ellipse cx="15" cy="20" rx="13" ry="16" fill="#dcebf5" stroke="#aac8e0" stroke-width="2"/></svg>
    <svg class="sw-bub" style="left:230px; bottom:110px; width:13px; animation:swRise 6.5s linear infinite; animation-delay:-2.2s;" viewBox="0 0 30 40"><ellipse cx="15" cy="20" rx="13" ry="16" fill="#dcebf5" stroke="#aac8e0" stroke-width="2"/></svg>
    <svg class="sw-bub" style="left:70px; bottom:100px; width:15px; animation:swRise 7.2s linear infinite; animation-delay:-4s;" viewBox="0 0 30 40"><ellipse cx="15" cy="20" rx="13" ry="16" fill="#dcebf5" stroke="#aac8e0" stroke-width="2"/></svg>
    <svg class="sw-star" style="top:-6px; right:26px; width:40px;" viewBox="0 0 100 100"><path d="M50 5 C55 35 65 45 95 50 C65 55 55 65 50 95 C45 65 35 55 5 50 C35 45 45 35 50 5 Z" fill="#f3e3ae"/></svg>
    <svg class="sw-star" style="bottom:180px; left:-4px; width:30px; animation-delay:-1.3s;" viewBox="0 0 100 100"><path d="M50 5 C55 35 65 45 95 50 C65 55 55 65 50 95 C45 65 35 55 5 50 C35 45 45 35 50 5 Z" fill="#f3e3ae"/></svg>
   </div>
  </div>
  <div class="sw-center">
    <div class="sw-card">
      <span class="t" id="swT">正在摆桌…</span>
      <span class="s" id="swS">WELCOME TO SODAFISH</span>
      <button class="r" type="button" id="swR" hidden>重新连接</button>
    </div>
  </div>
 </div>
</div>
<script>
(function () {
  var dark = document.documentElement.className.indexOf("soda-dark") >= 0;
  var f = document.createElement("iframe");
  f.id = "sodaFrame";
  f.setAttribute("sandbox", "allow-scripts allow-forms allow-popups allow-modals allow-downloads");
  f.setAttribute("allow", "clipboard-write");
  f.setAttribute("title", document.title || "SodaFish 小食堂");
  /* 三重防缓存：构建版本戳 + 会话随机串 + 时间戳，任何一个变化都会让浏览器/CDN 重新取内页 */
  var nonce = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  var appSrc = function () { return "app-canteen.html?v=202611231525&r=" + nonce + (dark ? "&theme=dark" : ""); };
  f.src = appSrc();
  document.body.insertBefore(f, document.body.firstChild);

  var box = document.getElementById("sodaWrapLoad");
  var T = document.getElementById("swT"), S = document.getElementById("swS"), R = document.getElementById("swR");
  var gone = false;
  function hide() {
    if (gone) return;
    gone = true;
    if (!box) return;
    box.className = "gone";
    setTimeout(function () { try { box.parentNode.removeChild(box); } catch (e) {} }, 400);
  }
  function fail() {
    if (gone) return;
    if (T) T.textContent = "网速有点慢，没能把食堂端上来";
    if (S) S.textContent = "TAP TO RETRY";
    if (R) R.hidden = false;
  }
  f.addEventListener("load", function () {
    /* 揭幕只由内层 soda ready 消息驱动，保证外层动画与内层启动屏严丝合缝，
       杜绝「动画播两遍」的闪回观感。保底：load 后 12 秒仍未 ready 才揭幕，
       防止死锁；旧版 8 秒偏早，在慢机上会在内层启动屏未消失时就露白。 */
    setTimeout(function () { hide(); }, 12000);
  });
  /* 已移除「6 秒未揭幕就静默换 nonce 重载 iframe」保险：慢机（如华为 Nova7）
     内层尚在加载时会被重启，导致启动动画重播闪回、白白加重卡顿。
     缓存失效仍由构建戳 + 会话随机串保证；重试交给用户主动点击。 */
  if (R) R.addEventListener("click", function () { location.reload(); });
  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== "object") return;
    if (d.soda === "ready") hide();
    if (d.soda === "ready" && d.dark) document.documentElement.className = "soda-dark";
  });
  setTimeout(fail, 15000);
})();
</script>
</body>
</html>
